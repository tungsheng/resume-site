<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 516" role="img"
     aria-label="Two stacked panels explaining how the router names a prefix. The top panel, BLOCK IDENTITY, shows one prompt split into four fixed-size blocks in a row. Under each block sits its local hash, written as a short hex token: 7f3a, b21c, 7f3a and e40d. Blocks 0 and 2 and their two 7f3a tokens are outlined in dashes and joined by a callout, because they contain the same tokens and so hash the same. Below them runs the chain of sequence hashes — s0 equals 7f3a, then s1 is 4d90, s2 is c8e2 and s3 is 1b57 — each folding in everything before it, so block 2 ends up with a different sequence hash from block 0 even though their local hashes match. The bottom panel, GLOBAL PREFIX INDEX, draws the tree many such requests build. A neutral root holds a green node for 7f3a, which branches into b21c and, along a greyed-out off-walk edge, 5c9d, and under b21c sits a second node also named 7f3a. The two 7f3a nodes are dashed, echoing the colliding blocks above: same local hash, different parent, so different nodes. Every hash node carries three small cells, one per worker, filled when that worker holds the block — three filled at 7f3a, two at b21c, one at the deeper 7f3a — so the worker set visibly shrinks with depth. To the right, a query walk panel walks the prompt's four hashes down the tree, showing the cells emptying row by row and a final greyed row where e40d finds no node and the walk stops, giving overlap scores of three blocks for worker 1, two for worker 2 and one for worker 3.">
  <title>Block identity and the global prefix index — hash tokens, and the worker set shrinking with depth</title>
  <style>
    .bg   { fill:#faf8f3; stroke:#e4e1da; }
    .ey   { font:600 12px 'JetBrains Mono',ui-monospace,monospace; letter-spacing:1.5px; fill:#2f7d3b; }
    .node { fill:#f3efe7; stroke:#1c1b17; stroke-width:1.3; }
    .tile { fill:#faf8f3; stroke:#cbc5b9; stroke-width:1; }
    .dup  { fill:#faf8f3; stroke:#6f6d68; stroke-width:1.3; stroke-dasharray:4 3; }
    .seq  { fill:#f3efe7; stroke:#1c1b17; stroke-width:1.2; }
    .acc  { fill:#e4f0e1; stroke:#2f7d3b; stroke-width:1.4; }
    .accd { fill:#e4f0e1; stroke:#2f7d3b; stroke-width:1.4; stroke-dasharray:4 3; }
    .panel{ fill:#f6f3ec; stroke:#e4e1da; stroke-width:1; }
    .on   { fill:#2f7d3b; stroke:#2f7d3b; stroke-width:0.8; }
    .off  { fill:#faf8f3; stroke:#a9a49a; stroke-width:0.9; }
    .lbl  { font:600 11px 'JetBrains Mono',ui-monospace,monospace; fill:#1c1b17; }
    .lblg { font:600 11px 'JetBrains Mono',ui-monospace,monospace; fill:#2f7d3b; }
    .lbls { font:600 9.5px 'JetBrains Mono',ui-monospace,monospace; fill:#1c1b17; }
    .cap  { font:400 8.5px 'JetBrains Mono',ui-monospace,monospace; fill:#6f6d68; }
    .mono { font:400 9.5px 'JetBrains Mono',ui-monospace,monospace; fill:#1c1b17; }
    .monm { font:400 9.5px 'JetBrains Mono',ui-monospace,monospace; fill:#79736a; }
    .ann  { font:400 10px 'JetBrains Mono',ui-monospace,monospace; fill:#6f6d68; }
    .note { font:400 9.5px 'JetBrains Mono',ui-monospace,monospace; fill:#79736a; }
    .lgd  { font:400 9.5px 'JetBrains Mono',ui-monospace,monospace; fill:#6f6d68; }
    .div  { stroke:#cbc5b9; stroke-width:1; }
    .rule { stroke:#e4e1da; stroke-width:1; }
    .arrn { stroke:#6f6d68; stroke-width:1.4; fill:none; }
    .edge { stroke:#1c1b17; stroke-width:1.2; fill:none; }
    .edgo { stroke:#8f8a80; stroke-width:1.1; fill:none; stroke-dasharray:4 3; }
  </style>
  <defs>
    <marker id="af" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M3,0 L8,3 L3,6 Z" fill="#6f6d68"/></marker>
  </defs>

  <!-- ==================================================================
    COORDINATE ARITHMETIC  (canvas 740 x 516)
    Content column x 28..712; side caption column x=592..712.
    NAMING: local hashes are short hex tokens (7f3a / b21c / e40d / 5c9d),
      so a repeat is visible on sight and there is no letter sequence to
      hunt through.  Worker sets are three 9px cells, filled when that
      worker holds the block; cell order is w1, w2, w3, per the legend.
    TOP PANEL  content y 32..214
      blocks     x 60/188/316/444, w=116, y 60..98  (centres 118/246/374/502)
      callout    rail y=106 in two runs, 118..164 and 328..374, with stubs
                 up into blocks 0 and 2 (tips land on y=98); its caption
                 sits in the 164..328 gap, baseline y=110
      local hash x same, w=116, y 116..138  (blocks 0 and 2 dashed)
      seq hash   x same, w=116, y 154..178  (chain arrows at y=166)
      side caps  x=592: local y 119/130/141, sequence y 158/169/180/191
                 (23 chars max per line, so nothing passes x=712)
      prose      x=60, baselines y=200 and y=214
    divider hairline y=228
    BOTTOM PANEL content y 256..448
      root    x 172 w=86  y 268..294  (centre 215, no cells)
      cell key  "w1 w2 w3" baseline y=308, centred on the first cell trio
      7f3a    x 144 w=142 y 312..342  (centre 215, dashed)
      b21c    x  58 w=142 y 360..390  (centre 129)
      5c9d    x 230 w=142 y 360..390  (centre 301)
      7f3a'   x  58 w=142 y 406..436  (centre 129, dashed = the collision)
      child bar y=352 runs 129..301, midpoint 215 = the parent stem
      node interior: token x = left+12, baseline = centre+3;
                     cells right-aligned to left+130, y = centre-5
      tree note x=214, baselines y=410/424/438/452 (31 chars max, ends
                x<=400, so it clears the query panel at x=430)
      query panel x 430..712, y 268..436 (bottom-aligned with the tree)
                  rows y=330/348/366/384: token x=444, arrow x=494,
                  cells x=520..553, right label anchored to 698;
                  rules y=312 and y=396; overlap row y=414 with its
                  what-it-counts caption at y=428
    Legend row y 466..479 (cells x=128/140/152, dashed swatch x=444),
      labels baseline y=477; footer note y=502 (13px above the frame).
  =================================================================== -->

  <rect class="bg" x="1" y="1" width="738" height="514" rx="2"/>

  <!-- ===================== TOP: BLOCK IDENTITY ===================== -->
  <text class="ey" x="28" y="32">BLOCK IDENTITY</text>
  <text class="cap" x="712" y="32" text-anchor="end">one prompt, four fixed-size blocks</text>

  <!-- blocks -->
  <rect class="dup"  x="60"  y="60" width="116" height="38" rx="3"/>
  <text class="lbls" x="118" y="76" text-anchor="middle">block 0</text>
  <text class="cap"  x="118" y="90" text-anchor="middle">"predict the…"</text>
  <rect class="tile" x="188" y="60" width="116" height="38" rx="3"/>
  <text class="lbls" x="246" y="76" text-anchor="middle">block 1</text>
  <text class="cap"  x="246" y="90" text-anchor="middle">"learn from…"</text>
  <rect class="dup"  x="316" y="60" width="116" height="38" rx="3"/>
  <text class="lbls" x="374" y="76" text-anchor="middle">block 2</text>
  <text class="cap"  x="374" y="90" text-anchor="middle">"predict the…"</text>
  <rect class="tile" x="444" y="60" width="116" height="38" rx="3"/>
  <text class="lbls" x="502" y="76" text-anchor="middle">block 3</text>
  <text class="cap"  x="502" y="90" text-anchor="middle">"…and repeat"</text>

  <!-- callout: the two blocks that hash the same, label set in the gap -->
  <path class="arrn" d="M118,106 L164,106"/>
  <path class="arrn" d="M328,106 L374,106"/>
  <path class="arrn" d="M118,106 L118,100.8" marker-end="url(#af)"/>
  <path class="arrn" d="M374,106 L374,100.8" marker-end="url(#af)"/>
  <text class="cap" x="246" y="110" text-anchor="middle">same tokens → same local hash</text>

  <!-- local hashes -->
  <text class="cap" x="592" y="119">local hash —</text>
  <text class="cap" x="592" y="130">content only,</text>
  <text class="cap" x="592" y="141">position-independent</text>
  <rect class="dup"  x="60"  y="116" width="116" height="22" rx="2.5"/>
  <text class="mono" x="118" y="131" text-anchor="middle">7f3a</text>
  <rect class="tile" x="188" y="116" width="116" height="22" rx="2.5"/>
  <text class="mono" x="246" y="131" text-anchor="middle">b21c</text>
  <rect class="dup"  x="316" y="116" width="116" height="22" rx="2.5"/>
  <text class="mono" x="374" y="131" text-anchor="middle">7f3a</text>
  <rect class="tile" x="444" y="116" width="116" height="22" rx="2.5"/>
  <text class="mono" x="502" y="131" text-anchor="middle">e40d</text>

  <!-- sequence hashes -->
  <text class="cap" x="592" y="158">sequence hash — folds</text>
  <text class="cap" x="592" y="169">in everything before it</text>
  <text class="cap" x="592" y="180">s0 = h0, then</text>
  <text class="cap" x="592" y="191">s(i)=H(s(i-1)||h(i))</text>
  <rect class="seq"  x="60"  y="154" width="116" height="24" rx="3"/>
  <text class="mono" x="118" y="170" text-anchor="middle">s0 = 7f3a</text>
  <rect class="seq"  x="188" y="154" width="116" height="24" rx="3"/>
  <text class="mono" x="246" y="170" text-anchor="middle">s1 = 4d90</text>
  <rect class="seq"  x="316" y="154" width="116" height="24" rx="3"/>
  <text class="mono" x="374" y="170" text-anchor="middle">s2 = c8e2</text>
  <rect class="seq"  x="444" y="154" width="116" height="24" rx="3"/>
  <text class="mono" x="502" y="170" text-anchor="middle">s3 = 1b57</text>
  <path class="arrn" d="M176,166 L186,166" marker-end="url(#af)"/>
  <path class="arrn" d="M304,166 L314,166" marker-end="url(#af)"/>
  <path class="arrn" d="M432,166 L442,166" marker-end="url(#af)"/>

  <text class="ann" x="60" y="200">blocks 0 and 2 both hash to 7f3a — only their sequence hashes</text>
  <text class="ann" x="60" y="214">differ (s0 = 7f3a, s2 = c8e2). So does the tree below.</text>

  <line class="div" x1="28" y1="228" x2="712" y2="228"/>

  <!-- ===================== BOTTOM: THE INDEX ===================== -->
  <text class="ey" x="28" y="256">GLOBAL PREFIX INDEX</text>
  <text class="cap" x="712" y="256" text-anchor="end">keyed by local hash · parent links come from the workers' cache events</text>

  <!-- tree -->
  <rect class="node" x="172" y="268" width="86" height="26" rx="4"/>
  <text class="lbls" x="215" y="285" text-anchor="middle">root</text>

  <path class="edge" d="M215,294 L215,312"/>
  <text class="cap" x="258" y="308" text-anchor="middle">w1 w2 w3</text>
  <rect class="accd" x="144" y="312" width="142" height="30" rx="4"/>
  <text class="mono" x="156" y="330">7f3a</text>
  <rect class="on"  x="241" y="322" width="9" height="9" rx="1.5"/>
  <rect class="on"  x="253" y="322" width="9" height="9" rx="1.5"/>
  <rect class="on"  x="265" y="322" width="9" height="9" rx="1.5"/>

  <path class="edge" d="M215,342 L215,352 L129,352 L129,360"/>
  <path class="edgo" d="M215,342 L215,352 L301,352 L301,360"/>
  <rect class="acc" x="58" y="360" width="142" height="30" rx="4"/>
  <text class="mono" x="70" y="378">b21c</text>
  <rect class="on"  x="155" y="370" width="9" height="9" rx="1.5"/>
  <rect class="on"  x="167" y="370" width="9" height="9" rx="1.5"/>
  <rect class="off" x="179" y="370" width="9" height="9" rx="1.5"/>
  <rect class="acc" x="230" y="360" width="142" height="30" rx="4"/>
  <text class="mono" x="242" y="378">5c9d</text>
  <rect class="off" x="327" y="370" width="9" height="9" rx="1.5"/>
  <rect class="off" x="339" y="370" width="9" height="9" rx="1.5"/>
  <rect class="on"  x="351" y="370" width="9" height="9" rx="1.5"/>

  <path class="edge" d="M129,390 L129,406"/>
  <rect class="accd" x="58" y="406" width="142" height="30" rx="4"/>
  <text class="mono" x="70" y="424">7f3a</text>
  <rect class="on"  x="155" y="416" width="9" height="9" rx="1.5"/>
  <rect class="off" x="167" y="416" width="9" height="9" rx="1.5"/>
  <rect class="off" x="179" y="416" width="9" height="9" rx="1.5"/>

  <text class="ann" x="214" y="410">7f3a appears twice: same local</text>
  <text class="ann" x="214" y="424">hash, different parent, so a</text>
  <text class="ann" x="214" y="438">different node. 5c9d belongs to</text>
  <text class="ann" x="214" y="452">another request that diverged.</text>

  <!-- query walk -->
  <rect class="panel" x="430" y="268" width="282" height="168" rx="4"/>
  <text class="lbl"  x="444" y="288">query walk</text>
  <text class="cap"  x="444" y="302">all four blocks above, walked down from the root</text>
  <line class="rule" x1="444" y1="312" x2="698" y2="312"/>

  <text class="mono" x="444" y="330">7f3a</text>
  <text class="cap"  x="494" y="330">→</text>
  <rect class="on"  x="520" y="322" width="9" height="9" rx="1.5"/>
  <rect class="on"  x="532" y="322" width="9" height="9" rx="1.5"/>
  <rect class="on"  x="544" y="322" width="9" height="9" rx="1.5"/>
  <text class="cap"  x="698" y="330" text-anchor="end">depth 1</text>

  <text class="mono" x="444" y="348">b21c</text>
  <text class="cap"  x="494" y="348">→</text>
  <rect class="on"  x="520" y="340" width="9" height="9" rx="1.5"/>
  <rect class="on"  x="532" y="340" width="9" height="9" rx="1.5"/>
  <rect class="off" x="544" y="340" width="9" height="9" rx="1.5"/>
  <text class="cap"  x="698" y="348" text-anchor="end">depth 2</text>

  <text class="mono" x="444" y="366">7f3a</text>
  <text class="cap"  x="494" y="366">→</text>
  <rect class="on"  x="520" y="358" width="9" height="9" rx="1.5"/>
  <rect class="off" x="532" y="358" width="9" height="9" rx="1.5"/>
  <rect class="off" x="544" y="358" width="9" height="9" rx="1.5"/>
  <text class="cap"  x="698" y="366" text-anchor="end">depth 3</text>

  <text class="monm" x="444" y="384">e40d</text>
  <text class="cap"  x="494" y="384">→</text>
  <text class="monm" x="536" y="384" text-anchor="middle">—</text>
  <text class="cap"  x="698" y="384" text-anchor="end">no node — the walk stops</text>

  <line class="rule" x1="444" y1="396" x2="698" y2="396"/>
  <text class="lblg" x="444" y="414">overlap:</text>
  <text class="lblg" x="520" y="414">w1 = 3</text>
  <text class="lblg" x="580" y="414">w2 = 2</text>
  <text class="lblg" x="640" y="414">w3 = 1</text>
  <text class="cap"  x="444" y="428">blocks matched, per worker — the column sums above</text>

  <!-- legend -->
  <rect class="on"  x="128" y="468" width="9" height="9" rx="1.5"/>
  <rect class="on"  x="140" y="468" width="9" height="9" rx="1.5"/>
  <rect class="off" x="152" y="468" width="9" height="9" rx="1.5"/>
  <text class="lgd" x="169" y="477">w1 w2 w3 — filled means the worker holds it</text>
  <rect class="dup" x="444" y="466" width="13" height="13" rx="2"/>
  <text class="lgd" x="464" y="477">the same local hash, twice</text>

  <text class="note" x="370" y="502" text-anchor="middle">each row's worker set is a subset of the row above — matches only shrink with depth</text>
</svg>
